# Local gates. Install both with `make install-hooks` after installing
# gitleaks 8.30.1 and pre-commit.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        name: Gitleaks staged-content scan
        args: ["--config=.gitleaks.toml", "--redact=100", "--max-decode-depth=1"]
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: gitleaks-pre-push
        name: Gitleaks full-history scan before push
        entry: gitleaks git --config .gitleaks.toml --max-decode-depth=1 --no-banner --redact=100 .
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        exclude: ^testdata/synthetic/
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
