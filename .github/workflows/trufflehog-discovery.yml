name: TruffleHog discovery

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Scheduled full-history discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRUFFLEHOG_VERSION: "3.97.1"
      TRUFFLEHOG_ARCHIVE_SHA256: "f863ea3a8d786f7d097870496c977944cce7372a2fe1e56707d965016e543ece"
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned TruffleHog binary
        shell: bash
        run: |
          set -euo pipefail
          archive="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          bin_dir="$RUNNER_TEMP/trufflehog-bin"
          mkdir -p "$bin_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${archive}" \
            --output "$archive_path"
          printf '%s  %s\n' "$TRUFFLEHOG_ARCHIVE_SHA256" "$archive_path" \
            | sha256sum --check --strict
          tar -xzf "$archive_path" -C "$bin_dir" trufflehog
          chmod 0755 "$bin_dir/trufflehog"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Discover findings and publish the job summary
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/trufflehog-results.jsonl"
          set +e
          trufflehog git file://. \
            --config .trufflehog.yml \
            --exclude-paths .trufflehog-exclude-paths.txt \
            --no-verification \
            --no-update \
            --json \
            --fail \
            --fail-on-scan-errors \
            >"$report"
          scan_status=$?
          set -e

          status="$scan_status"
          validation_error=false
          if jq -s -e 'type == "array" and all(.[]; type == "object" and (.DetectorName | type == "string"))' \
            "$report" >/dev/null 2>&1; then
            findings="$(jq -s 'length' "$report")"
            result="No findings"
            if [[ "$findings" -gt 0 ]]; then
              result="$findings candidate finding(s); discovery failed"
              status=183
            fi
          else
            findings="Unavailable"
            result="Scanner error: output was not valid JSON Lines"
            status=2
            validation_error=true
          fi

          if [[ "$validation_error" == false ]] \
            && [[ "$scan_status" -ne 0 ]] \
            && ! { [[ "$scan_status" -eq 183 ]] && [[ "$findings" -gt 0 ]]; }; then
            status="$scan_status"
            result="Scanner error: exit code $scan_status"
          fi

          summary_event="$(jq -rn --arg value "$GITHUB_EVENT_NAME" '$value | gsub("[^A-Za-z0-9._:/@+-]"; "_")')"
          summary_ref="$(jq -rn --arg value "$GITHUB_REF" '$value | gsub("[^A-Za-z0-9._:/@+-]"; "_")')"

          # shellcheck disable=SC2016
          {
            printf '## TruffleHog scheduled discovery\n\n'
            printf '| Field | Result |\n'
            printf '| --- | --- |\n'
            printf '| Outcome | %s |\n' "$result"
            printf '| Scanner | TruffleHog `%s` |\n' "$TRUFFLEHOG_VERSION"
            printf '| Scope | Complete checked-out Git history; intentional `testdata/synthetic/` corpus excluded by `.trufflehog-exclude-paths.txt` |\n'
            printf '| Trigger | `%s` on `%s` |\n' "$summary_event" "$summary_ref"
            printf '| Commit | [`%s`](%s/%s/commit/%s) |\n' \
              "${GITHUB_SHA:0:7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '| Provider checks | Disabled; no candidate is sent to an issuing service |\n'
            printf '| Control role | Detective hygiene and legacy discovery; this workflow does not prevent the first remote push or merge |\n'
            printf '| Report handling | Raw JSON stays in temporary runner storage and is not uploaded |\n'

            if [[ "$findings" != "Unavailable" ]] && [[ "$findings" -gt 0 ]]; then
              printf '\n### Findings by detector\n\n'
              printf '| Detector | Count |\n'
              printf '| --- | ---: |\n'
              jq -sr 'group_by(.DetectorName)[] |
                "| `\(.[0].DetectorName | gsub("[^A-Za-z0-9._:/+-]"; "_"))` | \(length) |"' "$report"
              printf '\nMatched values and locations are intentionally omitted. Revoke or rotate confirmed credentials before repository cleanup.\n'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          printf 'TruffleHog exit code: %s; findings: %s\n' "$status" "$findings"
          if [[ "$status" -eq 183 ]] && [[ "$findings" != "Unavailable" ]] && [[ "$findings" -gt 0 ]]; then
            printf 'Discovery found candidate credentials. Treat them as incident data; the raw report remains in temporary runner storage.\n' >&2
            exit 1
          fi
          if [[ "$status" -ne 0 ]]; then
            printf 'TruffleHog failed with exit code %s.\n' "$status" >&2
            exit "$status"
          fi
