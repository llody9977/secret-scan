name: Remote scanner evaluation

run-name: Remote scanner evaluation · ${{ github.sha }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Checked-in corpus — Gitleaks + TruffleHog (not a merge gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      TRUFFLEHOG_VERSION: "3.97.1"
      TRUFFLEHOG_ARCHIVE_SHA256: "f863ea3a8d786f7d097870496c977944cce7372a2fe1e56707d965016e543ece"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned scanner binaries
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/scanner-bin"
          mkdir -p "$bin_dir"

          gitleaks_archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gitleaks_path="$RUNNER_TEMP/$gitleaks_archive"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${gitleaks_archive}" \
            --output "$gitleaks_path"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$gitleaks_path" \
            | sha256sum --check --strict
          tar -xzf "$gitleaks_path" -C "$bin_dir" gitleaks

          trufflehog_archive="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          trufflehog_path="$RUNNER_TEMP/$trufflehog_archive"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${trufflehog_archive}" \
            --output "$trufflehog_path"
          printf '%s  %s\n' "$TRUFFLEHOG_ARCHIVE_SHA256" "$trufflehog_path" \
            | sha256sum --check --strict
          tar -xzf "$trufflehog_path" -C "$bin_dir" trufflehog

          chmod 0755 "$bin_dir/gitleaks" "$bin_dir/trufflehog"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Scan the checked-in corpus and publish the job summary
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/hosted-scanner-results.json"
          ./scripts/compare-secret-scanners.sh --json >"$result"

          # The JSON contains detector metadata only; raw TruffleHog matches
          # never leave the script's ephemeral working directory.
          jq . "$result"
          {
            printf '## Checked-in synthetic corpus\n\n'
            printf -- '- Commit: [%s](%s/%s/commit/%s)\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf -- '- Corpus: [testdata/synthetic](%s/%s/tree/%s/testdata/synthetic)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf -- '- Provider checks: disabled\n\n'
            printf '| Scenario | Decision | Gitleaks | TruffleHog |\n'
            printf '| --- | --- | --- | --- |\n'
            jq -r '.corpus.scenarios[] | [
              .credential_class,
              .expected_control_decision,
              (if .gitleaks.detected then "Detected: `\(.gitleaks.detector)`" else "No finding" end),
              (if .trufflehog.detected then "Detected: `\(.trufflehog.detector)`" else "No finding" end)
            ] | "| \(.[0]) | \(.[1]) | \(.[2]) | \(.[3]) |"' "$result"
            printf '\nThese are regression outcomes for the committed manifest and pinned configurations, not production accuracy rates.\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload machine-readable hosted result
        id: upload-result
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hosted-scanner-results-${{ github.sha }}
          path: ${{ runner.temp }}/hosted-scanner-results.json
          if-no-files-found: error
          retention-days: 90

      - name: Link the result artifact from the job summary
        env:
          ARTIFACT_URL: ${{ steps.upload-result.outputs.artifact-url }}
        run: printf '\n[Download the machine-readable result artifact](%s)\n' "$ARTIFACT_URL" >>"$GITHUB_STEP_SUMMARY"

      - name: Explain workflow semantics
        run: |
          printf '%s\n' \
            'This job scans the checked-in fictional corpus on a GitHub-hosted runner.' \
            'Do not configure it as the required merge gate.' \
            'Use the separate Gitleaks full-history gate for that purpose.'
